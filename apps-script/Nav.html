<!-- ===== เมนูขีด 3 ขีด ใช้ร่วมกันทุกหน้า (สไตล์แบบเว็บ Intervention) =====
     ใส่ในหน้าเว็บด้วยคำสั่ง include('Nav', ...) ในแท็กสคริปต์เล็ต (ดูบรรทัดแรกหลัง <body> ของ Leave.html)
     เปิด/ปิดด้วย hxOpen() / hxClose()  คลาสทั้งหมดขึ้นต้นด้วย hx- จะได้ไม่ชนกับสไตล์ของแต่ละหน้า -->
<style>
.hx-ov{position:fixed;inset:0;background:rgba(15,23,42,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:900;opacity:0;pointer-events:none;transition:opacity .25s}
.hx-ov.hx-on{opacity:1;pointer-events:auto}
.hx-dr{position:fixed;top:0;left:0;bottom:0;width:288px;max-width:86%;background:#fff;z-index:901;box-shadow:0 25px 50px -12px rgba(76,52,170,.35);
  border-right:1px solid #F0ECFC;border-radius:0 28px 28px 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;justify-content:space-between;transform:translateX(-105%);transition:transform .3s ease-in-out;will-change:transform;
  font-family:'Prompt','Sarabun',system-ui,sans-serif;color:#334155;box-sizing:border-box;overflow-y:auto}
.hx-dr.hx-on{transform:none}
.hx-dr *{box-sizing:border-box}
.hx-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid #f1f5f9;margin-bottom:18px}
.hx-brand{display:flex;align-items:center;gap:10px}
.hx-logo{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,#EDE8FF,#FFE4EC);box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(147,129,255,.18)}
.hx-brand b{display:block;font-size:14px;color:#2A2550;line-height:1.2}
.hx-brand small{display:block;font-size:11px;color:#94a3b8}
.hx-x{border:0;background:transparent;color:#94a3b8;font-size:26px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:10px}
.hx-x:hover{color:#475569;background:#f8fafc}
.hx-cap{font-size:11px;font-weight:700;color:#a5a0c8;letter-spacing:.04em;margin:0 4px 8px}
.hx-list{display:flex;flex-direction:column;gap:8px}
.hx-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;text-decoration:none;color:#475569;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.hx-it:hover{background:#f8f7ff}
.hx-it:active{transform:scale(.98)}
.hx-ic{width:40px;height:40px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.hx-violet .hx-ic{background:#EDE8FF}.hx-peach .hx-ic{background:#FFE9DA}.hx-mint .hx-ic{background:#DDF7EE}.hx-sky .hx-ic{background:#DCEBFF}
.hx-tx{min-width:0;flex:1}
.hx-tx b{display:block;font-size:14px;font-weight:700;color:#1e293b}
.hx-tx small{display:block;font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-it.hx-act{background:linear-gradient(100deg,#7C5CFF 0%,#B57BFF 52%,#FF9EB0 100%);box-shadow:0 8px 18px -6px rgba(139,108,255,.55)}
.hx-it.hx-act .hx-ic{background:rgba(255,255,255,.28);box-shadow:none}
.hx-it.hx-act .hx-tx b,.hx-it.hx-act .hx-tx small{color:#fff}
.hx-dot{width:8px;height:8px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.hx-ft{font-size:11px;color:#94a3b8;text-align:center;margin-top:20px}
.hx-load{display:none;position:fixed;inset:0;z-index:950;align-items:center;justify-content:center;background:rgba(255,255,255,.55)}
.hx-load.hx-on{display:flex}
.hx-spin{width:38px;height:38px;border-radius:50%;border:4px solid #EDE8FF;border-top-color:#7C5CFF;animation:hxs .8s linear infinite}
@keyframes hxs{to{transform:rotate(360deg)}}
</style>

<div class="hx-ov" id="hxOv" onclick="hxClose()"></div>
<aside class="hx-dr" id="hxDr" aria-hidden="true">
  <div>
    <div class="hx-hd">
      <div class="hx-brand">
        <span class="hx-logo">🏥</span>
        <span><b>งานรังสีวิทยา</b><small>โรงพยาบาลระยอง</small></span>
      </div>
      <button type="button" class="hx-x" onclick="hxClose()" aria-label="ปิดเมนู">&times;</button>
    </div>
    <div class="hx-cap">เลือกระบบ</div>
    <div class="hx-list">
      <? menu.forEach(function (m) { var act = m.key && m.key === page; ?>
      <a class="hx-it hx-<?= m.tone || 'violet' ?><?= act ? ' hx-act' : '' ?>" href="<?= m.href ?>" target="_top" data-act="<?= act ? 1 : 0 ?>">
        <span class="hx-ic"><?= m.icon ?></span>
        <span class="hx-tx"><b><?= m.title ?></b><small><?= m.sub ?></small></span>
        <? if (act) { ?><span class="hx-dot"></span><? } ?>
      </a>
      <? }); ?>
    </div>
  </div>
  <div class="hx-ft">รพ.ระยอง · กลุ่มงานรังสีวิทยา</div>
</aside>
<div class="hx-load" id="hxLoad"><div class="hx-spin"></div></div>

<script>
(function () {
  var dr = document.getElementById('hxDr'), ov = document.getElementById('hxOv');
  window.hxOpen = function () { dr.classList.add('hx-on'); ov.classList.add('hx-on'); dr.setAttribute('aria-hidden', 'false'); };
  window.hxClose = function () { dr.classList.remove('hx-on'); ov.classList.remove('hx-on'); dr.setAttribute('aria-hidden', 'true'); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hxClose(); });
  // กดระบบที่เปิดอยู่แล้ว = แค่ปิดเมนู / กดระบบอื่น = แสดงวงหมุนระหว่างเปลี่ยนหน้า
  dr.addEventListener('click', function (e) {
    var a = e.target.closest('.hx-it');
    if (!a) return;
    if (a.dataset.act === '1') { e.preventDefault(); hxClose(); return; }
    document.getElementById('hxLoad').classList.add('hx-on');
  });
  // ปัดซ้ายเพื่อปิดเมนู (มือถือ)
  var sx = null;
  dr.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  dr.addEventListener('touchend', function (e) { if (sx !== null && sx - e.changedTouches[0].clientX > 60) hxClose(); sx = null; });
  // กลับมาหน้าเดิมด้วยปุ่ม Back ของเบราว์เซอร์ ให้ซ่อนวงหมุน
  window.addEventListener('pageshow', function () { document.getElementById('hxLoad').classList.remove('hx-on'); });
})();
</script>
